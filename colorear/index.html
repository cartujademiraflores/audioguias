<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiración - Cuaderno de Colorear</title>
    <style>
        /* ESTILOS BÁSICOS (Móvil First) */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Color de fondo suave */
            color: #333;
        }

        header {
            background-color: #2c3e50; /* Color oscuro elegante */
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        p { margin-top: 5px; opacity: 0.8; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* TARJETA DE CADA ESCENA */
        .scene-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .scene-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        /* EL DESLIZADOR MÁGICO (Slider) */
        .slider-container {
            position: relative;
            width: 100%;
            /* Ajusta esta altura según la proporción de tus fotos. 
               Si son verticales, necesitarás más altura (ej. 400px o 500px) */
            height: 400px; 
            overflow: hidden;
            border-radius: 8px;
        }

        .img-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .img-foreground {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%; /* Empieza a la mitad */
            background-size: cover; /* IMPORTANTE: cover ajusta la imagen */
            background-position: left center; /* Ancla la imagen a la izquierda */
            border-right: 3px solid white; /* La línea blanca divisoria */
            box-sizing: border-box;
        }

        /* El control deslizante invisible que el usuario toca */
        .slider-range {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0; /* Invisible pero funcional */
            cursor: ew-resize; /* Cursor de flechitas */
            z-index: 10;
        }

        /* CÍRCULOS DE PALETA DE COLORES */
        .palette {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        .palette span { font-size: 0.9rem; color: #666; }
        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #ddd;
            display: inline-block;
        }

        /* ETIQUETAS FLOTANTES (Real vs Arte) */
        .label {
            position: absolute;
            bottom: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            pointer-events: none; /* Para que no moleste al tocar */
        }
        .label-real { right: 10px; }
        .label-arte { left: 10px; z-index: 5; }

    </style>
</head>
<body>

<header>
    <h1>Inspírate y Colorea</h1>
    <p>Desliza para ver la magia</p>
</header>

<div class="container">

    <div class="scene-card">
        <h2 class="scene-title">1. La Puerta del Monasterio</h2>
        
        <div class="slider-container" id="slider1">
            <div class="img-background" style="background-image: url('img/exterior.png');"></div>
            
            <div class="img-foreground" style="background-image: url('img/exterior-real.png');">
                 <span class="label label-arte">🎨 Fantasía</span>
            </div>
            
            <span class="label label-real">📷 Realidad</span>
            
            <input type="range" min="0" max="100" value="50" class="slider-range" oninput="moveSlider(this, 'slider1')">
        </div>

        <div class="palette">
            <span>Usa estos tonos:</span>
            <div class="color-dot" style="background-color: #E6B325;"></div> <div class="color-dot" style="background-color: #8B4513;"></div> <div class="color-dot" style="background-color: #87CEEB;"></div> <div class="color-dot" style="background-color: #A9A9A9;"></div> </div>
    </div>

    <div class="scene-card">
        <h2 class="scene-title">2. El Retablo Mayor</h2>
        
        <div class="slider-container" id="slider2">
            <div class="img-background" style="background-image: url('img/exterior.png');"></div>
            <div class="img-foreground" style="background-image: url('img/exterior-real.png');">
                 <span class="label label-arte">🎨 Fantasía</span>
            </div>
            <span class="label label-real">📷 Realidad</span>
            <input type="range" min="0" max="100" value="50" class="slider-range" oninput="moveSlider(this, 'slider2')">
        </div>

        <div class="palette">
            <span>Usa estos tonos:</span>
            <div class="color-dot" style="background-color: #000080;"></div> <div class="color-dot" style="background-color: #FFD700;"></div> </div>
    </div>

</div>

<script>
    // Esta pequeña función hace la magia del movimiento
    function moveSlider(input, sliderId) {
        var sliderContainer = document.getElementById(sliderId);
        var foregroundImage = sliderContainer.querySelector('.img-foreground');
        // Cambia el ancho de la imagen superior según muevas el dedo
        foregroundImage.style.width = input.value + "%";
    }
</script>

</body>
</html>
